<style>
  /* The root carries the shared .app-shell scope, not its page layout. */
  #storybook-root {
    min-height: 0;
    max-width: 144ch;
    margin: auto;
    padding: 2.4rem 3ch;
  }
  @media (max-width: 700px) {
    #storybook-root {
      padding: 1.2rem 1ch;
    }
  }
</style>

<style>
  /* Page stories own their full-viewport shell. */
  #storybook-root:has(> .si-page),
  #storybook-root:has(> .management-page) {
    max-width: none;
    margin: 0;
    padding: 0;
  }
</style>
