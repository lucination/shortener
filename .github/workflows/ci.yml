name: CI and container images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize main publications; a HEAD check also rejects stale queued runs.
concurrency:
  group: ci-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Select tested Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt
      - name: Workflow safety tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Rust format, tests, and generated DTO drift
        run: |
          cargo +1.100.0 fmt --all -- --check
          cargo +1.100.0 test --locked --all-targets
          cargo +1.100.0 run --locked --bin export-contracts -- --check
      - name: Install SPA dependencies
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm ci --prefix admin --no-audit --no-fund
      - name: User SPA
        working-directory: web
        run: |
          npm run check-contracts
          npm run check
          npm test
          npm run build
      - name: Admin SPA
        working-directory: admin
        run: |
          npm run check
          npm run build
      - name: Companion extension types, behavior, packages and real Chromium clipboard
        run: |
          npm ci --prefix extension --ignore-scripts --no-audit --no-fund
          npm run check --prefix extension
          npm test --prefix extension
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth xdotool xclip
          npx --prefix web playwright install --with-deps chromium
          xvfb-run -a npm run test:browser --prefix extension

  native-image:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image identity and native runner guard
        id: identity
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          case "$ARCH:$(uname -m)" in amd64:x86_64|arm64:aarch64) ;; *) exit 1 ;; esac
          printf 'image=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native image into digest-only staging
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: VCS_REF=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ steps.identity.outputs.image }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=false
          provenance: false
          sbom: false
      - name: Smoke-test the actual published digest
        env:
          IMAGE: ${{ steps.identity.outputs.image }}@${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 .github/scripts/smoke_image.py "$IMAGE" "$ARCH"
          HEALTH_TEST_IMAGE="$IMAGE" python3 -m unittest discover -s .github/scripts -p test_health.py -v
          python3 - <<'PY'
          import json, os, pathlib, re
          digest = os.environ['DIGEST']
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
              raise ValueError('Invalid build digest')
          pathlib.Path('digest').mkdir()
          pathlib.Path('digest', os.environ['ARCH'] + '.json').write_text(json.dumps({'architecture': os.environ['ARCH'], 'digest': digest}))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digest/*.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [test, native-image]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Verify both platform digests, publish one index, and read back latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_RESULT: ${{ needs.test.result }}
        run: python3 .github/scripts/release.py
