name: Firefox AMO read-only reconciliation
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact failed version to inspect (stable numeric version)
        required: true
        default: "0.1.1"
        type: string
      upload_id:
        description: Optional existing upload ID (32 lowercase hex, never a download token)
        required: false
        default: ""
        type: string
permissions:
  contents: read
jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'lucination/shortener'
    environment: firefox-addons
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.4"
      - name: Read only exact GUID/version and bounded upload inventory
        working-directory: extension
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
          AMO_RECONCILE_VERSION: ${{ inputs.version }}
          AMO_RECONCILE_UPLOAD_ID: ${{ inputs.upload_id }}
        run: node scripts/reconcile-firefox.mjs
