[package]
name = "shortener"
version = "0.1.0"
edition = "2024"
default-run = "shortener"

[dependencies]
loco-rs = { version = "=1.3.1", default-features = false, features = ["cli", "cache_inmem"] }
axum = "0.8"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "11", features = ["serde-json-impl", "no-serde-warnings"] }
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
argon2 = "0.5"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "ring", "webpki-roots"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation", "danger-credential-internals"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
webauthn-authenticator-rs = { version = "=0.5.5", default-features = false, features = ["softpasskey"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0
